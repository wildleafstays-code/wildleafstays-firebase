name: Temporary Prettier Diff

on:
  pull_request:
    paths:
      - "platform-api/src/modules/property-taxonomy/infrastructure/property-taxonomy-repository.ts"
      - "platform-api/src/modules/public-booking/transport/public-catalog-routes.ts"
      - ".github/workflows/prettier-diff-temp.yml"

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: platform-api/package-lock.json

      - name: Install dependencies
        working-directory: platform-api
        run: npm ci

      - name: Show exact Prettier diff
        working-directory: platform-api
        run: |
          npx prettier --write \
            src/modules/property-taxonomy/infrastructure/property-taxonomy-repository.ts \
            src/modules/public-booking/transport/public-catalog-routes.ts
          git diff -- \
            src/modules/property-taxonomy/infrastructure/property-taxonomy-repository.ts \
            src/modules/public-booking/transport/public-catalog-routes.ts
